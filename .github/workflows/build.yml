name: Build AFFNETCALC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Ekstrak AFFNETCALC
        run: |
          mkdir project
          unzip -o AFFNETCALC_GITHUB_BUILD.zip -d project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug
      - name: Siapkan AFFNETCALC APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk AFFNETCALC.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AFFNETCALC-APK
          path: AFFNETCALC.apk
